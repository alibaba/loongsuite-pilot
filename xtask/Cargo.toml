[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
publish = false
default-run = "xtask"

[[bin]]
name = "pilot-fixture"
path = "src/fixture.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
loongsuite-pilot = { path = ".." }
flate2 = "1"
regex = "1"
tar = "0.4"
walkdir = "2"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
tempfile = "3"
toml = "0.8"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokio = { version = "1", features = ["rt", "time", "net"] }

[dev-dependencies]
