# loongsuite-pilot-installer 管理员参数配置
# 管理员在分发插件前编辑本文件；hook 脚本（bash）会 source 本文件。
#
# 优先级：环境变量 LOONGSUITE_PILOT_* > 本文件 > 脚本内置默认值

# ---- loongsuite-pilot 安装脚本地址 ----
INSTALLER_URL="https://aliyun-observability-release-cn-shanghai.oss-cn-shanghai.aliyuncs.com/loongsuite-pilot/installer.sh"

# ---- Node 运行时（安装 pilot 的前置依赖） ----
# 统一使用 22.22.2；默认从 NODE_DIST_BASE_URL（OSS）在线下载，
# 若插件目录内存在 vendor/node/<tarball>（离线分发场景）则优先用本地包。
# 下载地址为 <NODE_DIST_BASE_URL>/node-v<版本>-<platform>.tar.gz（分发包平铺在该前缀下）
NODE_VERSION="22.22.2"
NODE_DIST_BASE_URL="https://taiye-test-sh.oss-cn-shanghai.aliyuncs.com/sensen-test"

# ---- installer 安装参数（按 "--参数名" "值" 成对填写，透传给 installer.sh install） ----
# 支持的参数见 installer.sh 头部注释；新增参数直接加行即可，无需改脚本
INSTALL_ARGS=(
    --collect-log "true"
    --collect-trace "true"
    --sls-project "agentloop-268e5339faebe7ceb5f5de62983e9e9c"
    --sls-logstore "agent-event-webtracking"
    --sls-endpoint "cn-hongkong.log.aliyuncs.com"
    --cms-license-key "gaddp9ap8q@eba4332910dd4ac"
    --cms-endpoint "https://proj-xtrace-1d3dc285e44fcb12fa8cbcb1dd13551-cn-hongkong.cn-hongkong.log.aliyuncs.com/apm/trace/opentelemetry"
    --cms-workspace "taiye-loongsuite-test"
    --service-name-prefix "ai-coding-agent"
    --mask-mode "all"
)
