# loongsuite-pilot-installer 管理员参数配置
# 管理员在分发插件前编辑本文件；hook 脚本（bash）会 source 本文件，
# ensure-pilot.ps1 亦按同一份 bash 语法解析。
#
# 本文件只配置透传给 installer 的安装参数（INSTALL_ARGS）。
# 安装器地址、Node 版本、Node 下载源均为插件内置常量（由维护者维护），无需管理员配置。

# ---- installer 安装参数（按 "--参数名" "值" 成对填写，透传给 installer install） ----
# 支持的参数见 installer 头部注释；新增参数直接加行即可，无需改脚本。
# 参数名 kebab-case（--collect-log），Windows 侧会自动转成 PascalCase（-CollectLog）。
INSTALL_ARGS=()
