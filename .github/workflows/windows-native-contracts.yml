name: Windows Native Contracts

on:
  workflow_dispatch:
  push:
    branches: [loongsuite-pilot-rust]
    paths: [.github/workflows/windows-native-contracts.yml]

permissions:
  contents: read

concurrency:
  group: windows-native-contracts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  native:
    name: Native contracts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-${{ matrix.target }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust 1.99.1 for the native runner
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-release-v1
          key: ${{ matrix.target }}-opensource
          cache-on-failure: true
      - name: Isolate test HOME while preserving the build toolchain
        run: |
          set -euo pipefail
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pilot-native-home"
          echo "HOME=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/pilot-native-home" >> "$GITHUB_ENV"
      - name: Require actual PS5.1 and PS7 bootstrap in both language modes
        run: python scripts/testing/windows-bootstrap-contracts.py --timeout-seconds 20
      - name: Compile native contract binaries without packaging
        id: compile
        run: |
          set -euo pipefail
          cargo build --locked -p xtask --bin xtask
          cargo test --locked -p xtask --bin xtask --test windows_services --no-run
          cargo test --locked -p loongsuite-pilot --lib --test hooks_native --test installer_native --test cli_native --test interceptor_native --test upstream_context --test hook_timing --test claude_entry_history --test claude_processor_history --test cursor_dispatch_history --test qoder_trace_cli_history --test qoder_trace_ide_history --test qoder_trace_multimodal_surfaces --test qoder_trace_multimodal_pipeline --test qoder_trace_multimodal_attachments --test qoder_trace_collect_history --test dsh_otlp_history --test qoder_cli_multimodal_contracts --test codex_timing_native_history --test qoder_cn_sqlite_contracts --no-run
      - name: Generated Hook wrappers match production assets
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./target/debug/xtask.exe sync-hook-wrappers --check
      - name: Positive native raw stdin and argv in PS5.1 and PS7 including CLM
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cargo test --locked -p loongsuite-pilot --test hooks_native --test claude_entry_history -- --nocapture
      - name: Native installer and uninstall contracts
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cargo test --locked -p loongsuite-pilot --test installer_native -- --nocapture
      - name: Native CLI contracts
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cargo test --locked -p loongsuite-pilot --test cli_native -- --nocapture
      - name: Both-shell services, arguments, and restart diagnostics
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cargo test --locked -p xtask --test windows_services -- --nocapture
      # Hashed recovery metadata must also persist beyond classic MAX_PATH.
      - name: Platform process, deployment, archive, and diagnostic regressions
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -uo pipefail
          failures=0
          for filter in \
            inputs::base::tests \
            inputs::codex_transcript:: \
            inputs::doubao_work:: \
            inputs::qoder_work_trace:: \
            inputs::qoder_trace:: \
            inputs::rest_support:: \
            inputs::workbuddy:: \
            inputs::codex_aborted_turn:: \
            inputs::dsh_log:: \
            inputs::dsh:: \
            inputs::qoder_work_log:: \
            inputs::qwen_work_cn:: \
            multimodal::resolve:: \
            multimodal::uploader:: \
            checkpoints:: \
            hook_process::tests::codex_ \
            hook_process::codex_timing_history:: \
            hook_process::cursor:: \
            hook_process::cursor_assemble:: \
            hook_process::claude_code:: \
            core::orchestrator:: \
            core::hook_watchdog:: \
            core::legacy_sls_failed_log_cleanup::tests \
            flushers:: \
            core::input_manager:: \
            utils::candidate_process::tests \
            core::config_loader::tests::reads_inner_config_from_canonical_data_dir \
            utils::pid_utils::tests \
            cli::dashboard_shortcut::tests \
            utils::process_discovery::tests \
            interceptor::cli::qoder_surface::tests \
            hook_process::qoder:: \
            utils::single_instance_lock::tests \
            deployment::hook_strategy:: \
            deployment::plugin_probe_strategy:: \
            deployment::codex_trust_writer:: \
            deployment::dsh_yaml_patch_strategy::tests \
            deployment::legacy_uninstall::tests \
            deployment::legacy_cli_cleanup:: \
            updater::package_archive::tests \
            updater::runtime::tests \
            utils::restart_breadcrumb::tests \
            core::updater_watchdog::; do
            cargo test --locked -p loongsuite-pilot --lib "$filter" -- --nocapture || failures=1
          done
          for filter in package::tests hooks::tests; do
            cargo test --locked -p xtask --bin xtask "$filter" -- --nocapture || failures=1
          done
          test "$failures" -eq 0
      - name: Native interceptor, upstream context, and Hook timing
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cargo test --locked -p loongsuite-pilot --test interceptor_native --test upstream_context --test hook_timing --test grok_output_contracts --test runtime_snapshot_allocation --test doubao_delivery --test doubao_pipeline --test hosted_collect_durability --test claude_processor_history --test cursor_dispatch_history --test qoder_trace_cli_history --test qoder_trace_ide_history --test qoder_trace_multimodal_surfaces --test qoder_trace_multimodal_pipeline --test qoder_trace_multimodal_attachments --test qoder_trace_collect_history --test dsh_otlp_history --test qoder_cli_multimodal_contracts --test codex_timing_native_history --test qoder_cn_sqlite_contracts -- --nocapture
