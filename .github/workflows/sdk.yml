name: Windows service acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  installation:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-rust-dependencies
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
        shell: bash
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: pilot-windows-service-p0
          cache-on-failure: true
      - name: Build the candidate and the failing collector fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p loongsuite-pilot --lib --bin loongsuite-pilot --bin loongsuite-pilot-sdk-hook
          cargo build --locked -p xtask --bin xtask
          sha="$(git rev-parse HEAD)"
          target=x86_64-pc-windows-msvc
          ./target/debug/xtask.exe package --target "$target" --binary target/debug/loongsuite-pilot.exe --commit "$sha" --output "$RUNNER_TEMP/pilot-healthy"
          cp src/main.rs "$RUNNER_TEMP/pilot-original-main.rs"
          python - <<'PY'
          from pathlib import Path
          file = Path('src/main.rs')
          source = file.read_text()
          start = 'fn main() {'
          injection = '''
              if std::env::args().nth(1).as_deref() == Some("run") {
                  if let Some(data) = std::env::var_os("LOONGSUITE_PILOT_DATA_DIR") {
                      let file = std::path::PathBuf::from(data).join("p0-injected-collector-failure");
                      if file.is_file() {
                          std::fs::write(file, b"scheduled native collector failed").unwrap();
                          std::process::exit(37);
                      }
                  }
              }
          '''
          assert source.count(start) == 1
          file.write_text(source.replace(start, start + injection))
          PY
          cargo build --locked -p loongsuite-pilot --lib --bin loongsuite-pilot --bin loongsuite-pilot-sdk-hook
          cp "$RUNNER_TEMP/pilot-original-main.rs" src/main.rs
          ./target/debug/xtask.exe package --target "$target" --binary target/debug/loongsuite-pilot.exe --commit "$sha" --output "$RUNNER_TEMP/pilot-fault"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install official Node and exercise Task Scheduler recovery
        shell: pwsh
        run: ./.github/pilot-windows-p0.ps1
      - name: Save Windows service evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-service-p0-evidence
          path: ${{ runner.temp }}/pilot-win-p0-logs
          retention-days: 3
      - name: Run native Hook and rollback contracts
        if: success()
        run: cargo test --locked -p loongsuite-pilot --test installer_native rollback_ -- --test-threads=1
