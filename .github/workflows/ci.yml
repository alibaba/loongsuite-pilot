name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: loongsuite-pilot
    strategy:
      matrix:
        node-version: [22, 23, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node -e "const s=require('fs').readFileSync('dist/hook-cli.cjs','utf8'); if(/node:sqlite|native-deps-guard/.test(s)) process.exit(1)"

  windows-interceptor-protocol:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Windows private duplex control and native readiness
        run: npm exec -- vitest run tests/unit/interceptor/managed-powershell-windows.test.ts --maxWorkers=1 --minWorkers=1 --reporter=verbose -t "overlapped fd3 duplex|reports native guardian"

  windows-interceptor:
    needs: windows-interceptor-protocol
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify real Windows PowerShell ownership and execution
        run: npm exec -- vitest run tests/unit/interceptor/managed-powershell-windows.test.ts tests/unit/interceptor/managed-powershell-pool.test.ts --maxWorkers=1 --minWorkers=1 --reporter=verbose

  qwenpaw-plugin:
    runs-on: loongsuite-pilot
    strategy:
      matrix:
        include:
          - qwenpaw: '2.1.0'
            agentscope: '2.0.4.post1'
            reme: '0.4.1.5'
          - qwenpaw: '2.2.1b1'
            agentscope: '2.0.7.post1'
            reme: '0.4.1.11'
          - qwenpaw: '2.2.1'
            agentscope: '2.0.7.post1'
            reme: '0.4.1.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv "$RUNNER_TEMP/qwenpaw-venv"
          "$RUNNER_TEMP/qwenpaw-venv/bin/python" -m pip install 'qwenpaw==${{ matrix.qwenpaw }}' 'agentscope==${{ matrix.agentscope }}' 'reme-ai==${{ matrix.reme }}'
          "$RUNNER_TEMP/qwenpaw-venv/bin/python" -m pip check
          "$RUNNER_TEMP/qwenpaw-venv/bin/python" tests/unit/hooks/qwenpaw-plugin/test_plugin.py
