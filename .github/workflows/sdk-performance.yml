name: Full Pilot performance history

on:
  push:
    branches: [main, dev/v2.0.0, codex/cloudshell-sdk-20261107]
  pull_request:
    branches: [main, dev/v2.0.0]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [main, dev, release, backfill]
        default: dev
      benchmark_method:
        description: Full Pilot benchmark method (Codex requires an explicit Rust source or release)
        type: choice
        options: [github-full-pilot-qoder-native-10s-v1, github-full-pilot-codex-rollout-10s-v1]
        default: github-full-pilot-qoder-native-10s-v1
      public_repository:
        description: Public source repository; formal releases use official upstream
        default: alibaba/loongsuite-pilot
      public_ref:
        description: Dev branch/SHA or stable release tag; main mode always resolves main
        default: ''
      continue_backfill:
        description: After one successful historical release, dispatch the next untested release
        type: boolean
        default: true
      confirmed_incompatible_tag:
        description: Backfill only; explicit maintainer-confirmed native collection incompatibility
        default: ''
      incompatibility_reason:
        description: Required for confirmation; infrastructure/timeouts/missing assets are not proof
        default: ''
      source_evidence_url:
        description: Immutable official blob URL proving the missing collection contract
        default: ''
      smoke_evidence_url:
        description: Actual completed failed official performance smoke run URL
        default: ''

permissions:
  contents: read

# Each distinct release has its own key: release events cannot evict one another.
# Main keeps only the newest queued request; each dev source/ref queues independently.
# Unrelated branches cannot evict the designated dev branch's pending request. Backfill requests all mean
# "select the next untested release" and can safely coalesce without skipping a tag.
concurrency:
  group: pilot-performance-${{ github.repository }}-${{ inputs.benchmark_method || 'github-full-pilot-qoder-native-10s-v1' }}-${{ github.event_name == 'release' && format('release-{0}', github.event.release.tag_name) || inputs.mode == 'release' && format('release-{0}', inputs.public_ref) || inputs.confirmed_incompatible_tag && format('compatibility-{0}', inputs.confirmed_incompatible_tag) || inputs.mode == 'backfill' && 'backfill' || github.event_name == 'pull_request' && format('readonly-pr-{0}', github.event.pull_request.number) || inputs.mode == 'main' && 'main' || github.ref == 'refs/heads/main' && 'main' || format('dev-{0}-{1}', inputs.public_repository || github.repository, inputs.public_ref || github.ref_name) }}
  cancel-in-progress: false

jobs:
  measure:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      node_ready: ${{ steps.result.outputs.node_ready }}
      mode: ${{ steps.select.outputs.mode }}
      method_id: ${{ steps.select.outputs.method_id }}
      repository: ${{ steps.select.outputs.repository }}
      ref: ${{ steps.select.outputs.ref }}
      commit: ${{ steps.select.outputs.commit }}
      kind: ${{ steps.select.outputs.kind }}
      version: ${{ steps.select.outputs.version }}
      is_target_dev: ${{ steps.select.outputs.is_target_dev }}
      asset_sha256: ${{ steps.select.outputs.asset_sha256 }}
      asset_id: ${{ steps.select.outputs.asset_id }}
      asset_name: ${{ steps.select.outputs.asset_name }}
      asset_size_bytes: ${{ steps.select.outputs.asset_size_bytes }}
      asset_url: ${{ steps.select.outputs.asset_url }}
      checksum_source: ${{ steps.select.outputs.checksum_source }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TERM_COLOR: always
      PERF_IMAGE: node:22-bookworm-slim
      BENCHMARK_METHOD: ${{ inputs.benchmark_method || 'github-full-pilot-qoder-native-10s-v1' }}
    steps:
      # PR/fork code runs only in this read-token job. The publication job never
      # checks out or executes a candidate. No pull_request_target is used.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Data-only protocol and publication regressions before any load
        run: python3 -m unittest discover -s scripts/performance -p 'test_*.py'
      - name: Select exact public source or next descending stable release
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || (github.event_name == 'release' && 'release') || (github.ref == 'refs/heads/main' && 'main') || 'dev' }}
          PUBLIC_REPOSITORY: ${{ inputs.public_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          PUBLIC_REF: ${{ inputs.public_ref || github.event.release.tag_name || github.event.pull_request.head.ref || github.ref_name }}
          CONFIRMED_TAG: ${{ inputs.confirmed_incompatible_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, urllib.parse
          sys.path.insert(0, 'scripts/performance')
          from prepare_public import api, public_repository, resolve, STABLE, QODER_STANDARD_METHOD
          mode=os.environ['MODE']; repository=os.environ['PUBLIC_REPOSITORY']; ref=os.environ['PUBLIC_REF']
          method=os.environ['BENCHMARK_METHOD']
          if mode=='main': repository='alibaba/loongsuite-pilot'; ref='main'
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'selection'); confirm=os.environ.get('CONFIRMED_TAG','')
          if confirm:
              if method != QODER_STANDARD_METHOD:
                  raise ValueError('choose the method tested by the compatibility evidence')
              if mode!='backfill' or repository!='alibaba/loongsuite-pilot' or not STABLE.fullmatch(confirm):
                  raise ValueError('explicit cutoff requires an official stable backfill release')
              public_repository(repository)
              release=api('repos/'+repository+'/releases/tags/'+urllib.parse.quote(confirm,safe=''))
              if release['draft'] or release['prerelease']: raise ValueError('not a published stable release')
              out.mkdir()
              value={'complete':False,'repository':repository,'ref':confirm,'commit':resolve(repository,confirm),
                     'kind':'release','version':confirm,'runtime':'none','confirmation_only':True,'method_id':method}
          else:
              subprocess.run(['python3','scripts/performance/prepare_public.py','--mode',mode,'--repository',repository,
                  '--ref',ref,'--history',str(pathlib.Path(os.environ['RUNNER_TEMP'],'history-before.json')),
                  '--output',str(out),'--benchmark-method',method],check=True)
              value=json.loads((out/'selection.json').read_text())
          value['mode']=mode
          (out/'selection.json').write_text(json.dumps(value,indent=2)+'\n')
          if not value.get('complete'):
              import html
              summary={key:value.get(key) for key in ('repository','ref','commit','kind','is_target_dev')}
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as report:
                  report.write('### Measured public source\n<pre>'+html.escape(json.dumps(summary,indent=2))+'</pre>\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key in ('complete','confirmation_only','mode','method_id','repository','ref','commit','runtime','kind','version','is_target_dev','package','native_entry','asset_sha256','asset_id','asset_name','asset_size_bytes','asset_url','checksum_source'):
                  item=value.get(key,False if key in ('confirmation_only','is_target_dev') else '')
                  text=str(item).lower() if isinstance(item,bool) else str(item)
                  if any(c in text for c in '\r\n\0'): raise ValueError('invalid workflow output')
                  output.write(key+'='+text+'\n')
          PY
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        if: steps.select.outputs.complete == 'false' && steps.select.outputs.confirmation_only != 'true' && steps.select.outputs.kind != 'release'
        with:
          repository: ${{ steps.select.outputs.repository }}
          ref: ${{ steps.select.outputs.commit }}
          path: candidate
          persist-credentials: false
      - name: Install pinned Rust compiler
        if: steps.select.outputs.runtime == 'rust' && steps.select.outputs.kind != 'release'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Prepare locked public Rust build dependencies
        if: steps.select.outputs.runtime == 'rust' && steps.select.outputs.kind != 'release'
        working-directory: candidate
        run: python3 scripts/build/prepare-rust-dependencies.py
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.select.outputs.runtime == 'rust' && steps.select.outputs.kind != 'release'
        with:
          workspaces: candidate -> target
          prefix-key: full-pilot-perf-v1
      - name: Build exact public release host and shared SDK
        if: steps.select.outputs.runtime == 'rust' && steps.select.outputs.kind != 'release'
        working-directory: candidate
        run: |
          set -euo pipefail
          cargo build --release --locked --lib --bin loongsuite-pilot
          echo "PILOT_BUILD_COMPILER=$(rustc --version)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pilot-runtime/bin"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pilot-runtime"
          cp target/release/loongsuite-pilot target/release/libloongsuite_pilot.so "$RUNNER_TEMP/pilot-runtime/bin/"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.select.outputs.runtime == 'js'
        with:
          node-version: '22'
      - name: Build exact public JS source with locked existing dependencies
        if: steps.select.outputs.runtime == 'js' && steps.select.outputs.kind != 'release'
        working-directory: candidate
        env:
          BUILD_MODE: opensource
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/pilot-build-home"
          export LOONGSUITE_PILOT_DATA_DIR="$RUNNER_TEMP/pilot-build-data"
          mkdir -p "$HOME" "$LOONGSUITE_PILOT_DATA_DIR"
          npm ci --ignore-scripts=false --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/pilot-runtime"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pilot-runtime"
          cp -a dist node_modules "$RUNNER_TEMP/pilot-runtime/"
          echo "PILOT_BUILD_COMPILER=$(node --version)" >> "$GITHUB_ENV"
      - name: Prepare packaged JS production dependencies before timing
        if: steps.select.outputs.runtime == 'js' && steps.select.outputs.kind == 'release'
        env:
          PACKAGE: ${{ steps.select.outputs.package }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/pilot-dependency-home"
          export LOONGSUITE_PILOT_DATA_DIR="$RUNNER_TEMP/pilot-dependency-data"
          mkdir -p "$HOME" "$LOONGSUITE_PILOT_DATA_DIR"
          if [ ! -d "$PACKAGE/node_modules" ]; then
            npm ci --prefix "$PACKAGE" --omit=dev --ignore-scripts=false --no-audit --no-fund
          fi
      - name: Prepare shared public runtime image before timing
        if: steps.select.outputs.complete == 'false' && steps.select.outputs.confirmation_only != 'true'
        run: docker pull "$PERF_IMAGE"
      - name: Exact public full-runtime collection protocol smoke
        id: smoke
        if: steps.select.outputs.complete == 'false' && steps.select.outputs.confirmation_only != 'true'
        continue-on-error: true
        env:
          PACKAGE: ${{ steps.select.outputs.package }}
          NATIVE_ENTRY: ${{ steps.select.outputs.native_entry }}
          KIND: ${{ steps.select.outputs.kind }}
          VERSION: ${{ steps.select.outputs.version }}
          COMMIT: ${{ steps.select.outputs.commit }}
          RUNTIME: ${{ steps.select.outputs.runtime }}
          SOURCE_REPOSITORY: ${{ steps.select.outputs.repository }}
          SOURCE_REF: ${{ steps.select.outputs.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts/performance')
          from prepare_public import CODEX_STANDARD_METHOD
          method=os.environ['BENCHMARK_METHOD']
          codex=method==CODEX_STANDARD_METHOD
          driver='codex_history.py' if codex else 'pilot_history.py'
          package=os.environ['PACKAGE'] if os.environ['KIND']=='release' else str(pathlib.Path(os.environ['RUNNER_TEMP'],'pilot-runtime'))
          args=['python3','scripts/performance/'+driver,'--package',package,'--image',os.environ['PERF_IMAGE'],
              '--output',str(pathlib.Path(os.environ['RUNNER_TEMP'],'smoke')),
              '--kind',os.environ['KIND'],'--version',os.environ['VERSION'],'--commit',os.environ['COMMIT'],
              '--source-repository',os.environ['SOURCE_REPOSITORY'],'--source-ref',os.environ['SOURCE_REF'],'--smoke-only']
          if not codex: args+=['--runtime',os.environ['RUNTIME'],'--benchmark-method',method]
          entry=os.environ.get('NATIVE_ENTRY','')
          if entry: args+=['--native-entry',entry]
          subprocess.run(args,check=True)
          PY
      - name: Three loads and three rounds with the same full-runtime method
        id: benchmark
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE: ${{ steps.select.outputs.package }}
          NATIVE_ENTRY: ${{ steps.select.outputs.native_entry }}
          KIND: ${{ steps.select.outputs.kind }}
          VERSION: ${{ steps.select.outputs.version }}
          COMMIT: ${{ steps.select.outputs.commit }}
          RUNTIME: ${{ steps.select.outputs.runtime }}
          SOURCE_REPOSITORY: ${{ steps.select.outputs.repository }}
          SOURCE_REF: ${{ steps.select.outputs.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts/performance')
          from prepare_public import CODEX_STANDARD_METHOD
          method=os.environ['BENCHMARK_METHOD']
          codex=method==CODEX_STANDARD_METHOD
          driver='codex_history.py' if codex else 'pilot_history.py'
          package=os.environ['PACKAGE'] if os.environ['KIND']=='release' else str(pathlib.Path(os.environ['RUNNER_TEMP'],'pilot-runtime'))
          args=['python3','scripts/performance/'+driver,'--package',package,'--image',os.environ['PERF_IMAGE'],
              '--output',str(pathlib.Path(os.environ['RUNNER_TEMP'],'performance')),
              '--kind',os.environ['KIND'],'--version',os.environ['VERSION'],'--commit',os.environ['COMMIT'],
              '--source-repository',os.environ['SOURCE_REPOSITORY'],'--source-ref',os.environ['SOURCE_REF']]
          if not codex: args+=['--runtime',os.environ['RUNTIME'],'--benchmark-method',method]
          entry=os.environ.get('NATIVE_ENTRY','')
          if entry: args+=['--native-entry',entry]
          subprocess.run(args,check=True)
          PY
      - name: Prepare compact data-only publication artifact
        id: result
        if: always()
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, shutil
          base=pathlib.Path(os.environ['RUNNER_TEMP']); selection=base/'selection/selection.json'
          if not selection.is_file(): raise SystemExit(0)
          value=json.loads(selection.read_text())
          if value.get('complete'): raise SystemExit(0)
          out=base/'publication'; out.mkdir()
          shutil.copyfile(selection,out/'selection.json')
          node=base/'performance/node.json'
          if not value.get('confirmation_only'):
              if node.is_file() and not node.is_symlink() and node.stat().st_size<=4*1024*1024:
                  shutil.copyfile(node,out/'node.json')
              else:
                  # A failed identity record has no invented resource values.
                  # Startup/build/infra failures never become a compatibility cutoff.
                  method=value['method_id']
                  failed={'id':'v'+value['version'].lstrip('v') if value['kind']=='release' else value['kind'],
                      'kind':value['kind'],'version':value['version'],'commit':value['commit'],'status':'failed',
                      'recorded_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'method_id':method,'environment_id':'unavailable','environment':{},'workloads':{},
                      'run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
                      'source':{'repository':value['repository'],'ref':value['ref']},'failure_category':'infrastructure'}
                  (out/'node.json').write_text(json.dumps(failed)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('node_ready=true\n')
          PY
      - name: Preserve short-lived synthetic evidence outside the code/results branches
        if: always() && steps.select.outputs.complete == 'false' && steps.select.outputs.confirmation_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-performance-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/performance
            ${{ runner.temp }}/smoke
            ${{ runner.temp }}/selection/selection.json
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.result.outputs.node_ready == 'true'
        with:
          name: pilot-performance-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          retention-days: 30
          if-no-files-found: error
      - name: Keep missing rounds and quality failures blocking
        if: always() && steps.select.outputs.complete == 'false' && steps.select.outputs.confirmation_only != 'true' && (steps.smoke.outcome != 'success' || steps.benchmark.outcome != 'success')
        run: exit 1

  publish:
    if: always() && github.repository == 'alibaba/loongsuite-pilot' && github.event_name != 'pull_request' && needs.measure.outputs.node_ready == 'true' && (needs.measure.outputs.kind != 'dev' || needs.measure.outputs.is_target_dev == 'true')
    needs: measure
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      pull-requests: read
    outputs:
      site_updated: ${{ steps.publish.outputs.site_updated }}
    steps:
      # This exact official workflow commit is trusted. Candidate/fork code and
      # raw archives are never checked out or executed in this write-token job.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pilot-performance-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-input
      - name: Validate tips and CAS only the generated results branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SELECTION_JSON: ${{ toJSON(needs.measure.outputs) }}
          PUBLICATION_INPUT: publication-input
          CONTINUE_BACKFILL: ${{ inputs.continue_backfill && 'true' || 'false' }}
          CONFIRMED_INCOMPATIBLE_TAG: ${{ inputs.confirmed_incompatible_tag }}
          INCOMPATIBILITY_REASON: ${{ inputs.incompatibility_reason }}
          SOURCE_EVIDENCE_URL: ${{ inputs.source_evidence_url }}
          SMOKE_EVIDENCE_URL: ${{ inputs.smoke_evidence_url }}
        run: python3 scripts/performance/publish_history.py --github-publish

  site-dispatch:
    if: always() && needs.publish.result == 'success' && needs.publish.outputs.site_updated == 'true' && vars.PILOT_PERFORMANCE_PAGES == 'true'
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      actions: write
    steps:
      - name: Dispatch the independent site workflow at the results commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/performance-site.yml/dispatches" -f ref=sdk-performance-results
