name: "Sync from GitHub Open Source"

triggers:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    steps:
      - uses: checkout
        inputs:
          fetch-depth: 0

      - id: fetch
        run: |
          set -e
          GITHUB_URL="https://github.com/alibaba/loongsuite-pilot.git"
          git remote add github "$GITHUB_URL" 2>/dev/null || true
          git fetch github main

      - id: cherry-pick
        run: |
          set -e

          git config user.email "opensource-sync@alibaba-inc.com"
          git config user.name "Open Source Sync"

          # 标记文件：记录上次同步到的 GitHub commit SHA
          # 提交到 master，保证任务无状态——任何 runner 都能从仓库自身恢复进度
          MARKER=".opensource-sync-state"
          BASELINE="46c56553e7f51f428ed413d58a3b65bb1a764549"  # 开源 init squash commit

          if [ -f "$MARKER" ]; then
            LAST_SHA=$(cat "$MARKER")
          else
            # 首次运行：从 init squash commit 之后开始
            LAST_SHA="$BASELINE"
          fi

          # GitHub 新增的 commit（--first-parent 跟随主线，跳过 merge 的侧分支）
          COMMITS=$(git rev-list --first-parent --reverse "${LAST_SHA}..github/main")

          if [ -z "$COMMITS" ]; then
            echo "无新变更，跳过"
            exit 0
          fi

          TOTAL=$(echo "$COMMITS" | wc -l | tr -d ' ')
          echo "待同步: $TOTAL 个 commit"

          COUNT=0
          SKIPPED=0
          FAILED_SHA=""
          LAST_SUCCESS_GITHUB_SHA=""
          for SHA in $COMMITS; do
            COUNT=$((COUNT + 1))
            SUBJECT=$(git log -1 --format='%s' "$SHA")
            echo "[$COUNT/$TOTAL] cherry-pick ${SHA:0:7} $SUBJECT"

            if git cat-file -p "$SHA" | grep -q '^parent.*parent'; then
              PICK_ARGS="-m 1"
            else
              PICK_ARGS=""
            fi

            if ! git cherry-pick $PICK_ARGS "$SHA"; then
              if git diff --quiet HEAD; then
                echo "⏭ 空 cherry-pick（改动已存在），跳过"
                git cherry-pick --skip
                SKIPPED=$((SKIPPED + 1))
                LAST_SUCCESS_GITHUB_SHA="$SHA"
                continue
              fi
              FAILED_SHA="$SHA"
              echo "❌ cherry-pick 冲突: ${SHA:0:7} $SUBJECT"
              git cherry-pick --abort
              break
            fi
            LAST_SUCCESS_GITHUB_SHA="$SHA"
          done

          if [ -n "$LAST_SUCCESS_GITHUB_SHA" ]; then
            echo "$LAST_SUCCESS_GITHUB_SHA" > "$MARKER"
            git add "$MARKER"
            git commit -m "chore: update opensource sync state to ${LAST_SUCCESS_GITHUB_SHA:0:7}"
          fi

          echo "✅ 同步完成: $TOTAL 个 commit ($SKIPPED 个已存在被跳过)"

          if [ -n "$FAILED_SHA" ]; then
            SUBJECT=$(git log -1 --format='%s' "$FAILED_SHA")
            echo "FAILED_SHA=$FAILED_SHA" >> "${AONE_CI_OUTPUT:-/dev/null}"
            echo "同步中断于 ${FAILED_SHA:0:7}: $SUBJECT"
            exit 1
          fi

      - id: push
        run: |
          set -e
          git push origin master

      - id: notify-on-conflict
        if: failure()
        run: |
          echo "同步冲突，需人工介入"
          # curl -s -X POST "$DINGTALK_WEBHOOK" \
          #   -H 'Content-Type: application/json' \
          #   -d '{"msgtype":"text","text":{"content":"loongsuite-pilot 开源同步冲突，需人工介入"}}'
