name: Claude Code AI CR

triggers:
  push:
    branches:
      - feature/**
  merge_request:
    target-branches:
      - '**'

params:
  ANTHROPIC_BASE_URL:
    default: https://idealab.alibaba-inc.com/api/anthropic
    name: ANTHROPIC_BASE_URL
    description: Claude Code 环境变量，指定模型端口地址
    required: true
  ANTHROPIC_AUTH_TOKEN:
    default: d9d124073b90582633c9a368b8f9ac43
    name: ANTHROPIC_AUTH_TOKEN
    description: ANTHROPIC_AUTH_TOKEN
    required: true
  ANTHROPIC_MODEL:
    default: claude-opus-4-6
    name: ANTHROPIC_MODEL
    description: ANTHROPIC_MODEL
    required: false
  AONE_MCP_URL:
    default: https://mcp.alibaba-inc.com/code/mcp
    name: AONE_MCP_URL
    description: AONE_MCP_URL
    required: true
  shell:
    name: shell
    description: 执行脚本
    required: false
    default: |-
      #!/bin/bash

      # =============================================================================
      # 基于 MCP 的智能分层 AI 代码评审系统
      # 解决方案：通过 AONE MCP 获取 CR 信息，实现智能增量分析
      # =============================================================================
      
      # 配置 MCP 连接
      cat > mcp.json << 'EOF'
      {
        "mcpServers": {
          "aone": {
            "type": "sse",
            "url": "${{params.AONE_MCP_URL}}"
          }
        }
      }
      EOF
        
      repo=${{git.repo}}
      sourceBranch=${{git.branch}}
      echo "仓库: ${repo}, 分支: ${sourceBranch}"
      
      # =============================================================================
      # 步骤1: 检查是否存在评审中的 CR
      # =============================================================================
      echo "步骤1: 查找评审中的 CR..."
      cr_info=$(claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone__list_repo_merge_requests" --print "使用 aone mcp 的 list_repo_merge_requests 工具，指定3个参数为 repo=${repo}, state=opened, sourceBranch=${sourceBranch} 来查看评审中的 CR，如果失败请重试3次，如果最终还是不存在，则返回 'CR_NOT_FOUND'")
      
      echo "CR查询结果: $cr_info"
      echo "$cr_info" | grep -q 'CR_NOT_FOUND' && {
        echo "未找到评审中的 CR，退出分析"
        exit 0
      }
      
      
      # 判断已经存在的CR评论是否已经超过限制
      comments_info=$(claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone__list_merge_request_comments" --continue --print "使用 mcp__aone__list_merge_request_comments 工具获取当前分支已经提过的所有评论信息，如果已经存在高风险评论数量超过15个或者总评论数超过40个, 则返回'CR_MORE_LIMIT', 否则返回未超过限制")
      echo "评论结果: $comments_info"
        echo "$comments_info" | grep -q 'CR_MORE_LIMIT' && {
        echo "添加评论已超过限制，退出分析"
        exit 0
      }
      
      # =============================================================================
      # 步骤2: 获取 CR 的变更文件和现有评论
      # =============================================================================
      echo "步骤2: 获取 CR 变更文件和现有评论..."
      
      # 获取变更文件列表
      echo "===================================获取变更文件列表 START=========================================="
      claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone__list_merge_request_changed_files" --continue --print "使用 mcp__aone__list_merge_request_changed_files 工具获取当前分支用户更改过的所有变更文件列表，生成一个changed_files.md，必须写changed_files.md 文件成功，如果没有成功请重试3次"
      cat changed_files.md
      echo "
      ===================================获取变更文件列表 END==========================================
      "
      
      # 获取现有评论
      echo "===================================获取现有评论 START=========================================="
      claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone__list_merge_request_comments" --continue --print "使用 mcp__aone__list_merge_request_comments 工具获取当前分支已经提过的所有评论信息，生成一个existing_comments.md，必须写 existing_comments.md 文件成功,如果没有成功请重试3次"
      cat existing_comments.md
      echo "
      ===================================获取现有评论 END==========================================
      "

      # 拉取变更代码上下文
      echo "===================================获取变更代码上下文 START=========================================="
      claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone__get_changed_file_diff" --continue --print "
      使用 mcp__aone__get_changed_file_diff 工具拉取当前 CR 中每个变更文件的 diff，并生成 changed_code_context.md。

      要求：
      1. 必须先读取 changed_files.md，逐个识别当前 CR 的变更文件路径
      2. 对每个变更文件调用 mcp__aone__get_changed_file_diff 获取 diff；如果单个文件失败，记录失败原因并继续下一个文件
      3. changed_code_context.md 必须包含：文件路径、变更类型、关键 diff、可用于评论的新增行号范围
      4. 只记录当前 CR 的变更内容，不要引入未变更代码作为评论依据
      5. 如果 changed_files.md 不存在或没有任何变更文件，返回 'CHANGED_FILES_NOT_FOUND'
      "
      cat changed_code_context.md
      echo "
      ===================================获取变更代码上下文 END==========================================
      "

      # 使用 AONE MCP 搜索项目 specs 基准文件
      echo "===================================获取 specs 基准文件 START=========================================="
      claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone__search_code" --continue --print "
      使用 mcp__aone__search_code 工具查看项目中的 specs 基准文件，并生成 specs_reference.md。

      背景：
      - specs 是当前项目的基准文件，优先关注 loongsuite-pilot/specs 目录下的文件
      - 这些 specs 用来判断当前变更代码是否遵循基准约束，以及是否需要同步修改 specs

      搜索策略：
      1. 优先在 repo=${repo} 中搜索 specs 目录相关内容，搜索关键词包括：'specs'、'loongsuite-pilot/specs'
      2. 读取 changed_files.md 和 changed_code_context.md，根据变更文件的模块名、接口名、类名、配置名继续搜索相关 specs
      3. 如果 repo=${repo} 中没有找到相关 specs，再扩大到全局搜索 'loongsuite-pilot specs' 和相关模块关键词
      4. 每次搜索 pageSize 不超过 10，必要时翻页，但只保留和当前变更相关的 specs

      specs_reference.md 要求：
      - 记录每个相关 spec 的文件路径、标题/章节、关键约束摘要、和当前变更的关联原因
      - 如果搜索不到相关 specs，也必须生成 specs_reference.md，并明确写明没有找到相关 specs 以及已使用的搜索关键词
      - 不要臆造 specs 内容；只能基于 mcp__aone__search_code 返回的信息总结
      "
      cat specs_reference.md
      echo "
      ===================================获取 specs 基准文件 END==========================================
      "
      
      
      
      # =============================================================================
      # 步骤3: 主控分析器 - 智能分层分析
      # =============================================================================
      echo "步骤3: 执行智能分层分析..."
        
      exe_info=$(claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone__get_changed_file_diff,mcp__aone__search_code" --print "
      作为代码评审的主控分析器，执行以下任务：
        
      1. 读取当前分支中变更文件列表文档：changed_files.md
      2. 读取当前分支中现有评论文档：existing_comments.md
      3. 读取当前分支中变更代码上下文文档：changed_code_context.md
      4. 读取 specs 基准文件文档：specs_reference.md
      5. 如果 changed_code_context.md 不完整，使用 mcp__aone__get_changed_file_diff 工具补充获取每个变更文件的具体 diff；如果获取失败，忽略该文件，继续获取下个变更文件的具体 diff
      6. 如果 specs_reference.md 缺少和变更相关的 specs，使用 mcp__aone__search_code 工具继续搜索 loongsuite-pilot/specs 目录下相关内容
        
      然后进行智能分层分析，对变更区域进行3个划分，并补充 specs 基准一致性判断，生成4个精炼的描述文件：
        
      **level1_unanalyzed.md** - 完全未分析的区域
      - 格式：文件路径 | 行号范围 | 变更类型 | 关键信息
      - 区域判断标准：没有任何评论覆盖的代码变更区域
      - 要求：仅采纳高风险问题，添加的CR必须添加到对应的行数位置
        
       **level2_partial.md** - 部分分析过的区域
      - 格式：文件路径 | 行号范围 | 变更类型 | 新增部分描述
      - 区域判断标准：有部分评论但存在新增行的代码区域
      - 要求：仅采纳高风险问题，添加的CR必须添加到对应的行数位置
        
      **level3_recheck.md** - 需要重新审视的区域
      - 格式：文件路径 | 行号范围 | 变更类型 | 重审原因
      - 区域判断标准：已有评论但代码发生显著变化的区域
      - 要求：仅采纳高风险问题，添加的CR必须添加到对应的行数位置

      **specs_alignment.md** - specs 基准一致性判断
      - 格式：文件路径 | 关联 spec | 是否遵循 specs | 是否建议修改 specs | 原因
      - 区域判断标准：只分析当前 CR 中发生变更的代码文件
      - 要求：
        1. 将 specs_reference.md 视为项目基准
        2. 判断每个变更文件是否遵循 loongsuite-pilot/specs 中的约束
        3. 如果建议修改 specs，必须说明建议修改的 spec 文件/章节/字段、为什么当前代码变更需要推动 specs 更新
        4. 如果不建议修改 specs，必须说明原因，例如：变更只是实现细节、已被现有 spec 覆盖、没有改变对外契约、没有找到相关 spec 等
        5. 不要臆造 spec 内容；找不到相关 spec 时要明确说明搜索范围和结论
        
      要求：
      - 执行必须检查 changed_files.md、existing_comments.md、changed_code_context.md 和 specs_reference.md 是否存在，如果不存在，则返回 'FILE_NOT_FOUND'
      - 严格注意底线：只看当前分支里变更的部分！不允许对当前分支未变更的部分添加评论！
      - 每个描述文件内容精炼简短
      - 明确标识出具体的文件路径和行号范围
      - 便于后续3个处理器并行处理
      - 同样的问题不能重复提评论
      - 添加的评论必须添加到对应代码对应的行数位置，不允许错位
      - 仅采纳高风险问题
      - 添加的评论必须检查之前是否已经存在相似评论，如果已经存在相似评论，不能重复添加
      - 三个分层添加的评论，必须追加到 existing_comments.md, 每次添加评论必须检查是否在 existing_comments.md 存在相似记录，存在就不能重复添加
      - specs_alignment.md 必须解释每个相关变更是否需要修改 specs，以及需要或不需要的原因
        
      ")
      
      echo "分层分析执行结果: $exe_info"
        echo "$exe_info" | grep -q 'FILE_NOT_FOUND' && {
        echo "未找到变更文件和评论，退出分析"
        exit 0
      }

      # =============================================================================
      # 步骤4: specs 基准一致性分析
      # =============================================================================
      echo "步骤4: 执行 specs 基准一致性分析..."
      claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone" --continue --print "
      作为[仓库: ${repo}, 分支: ${sourceBranch}] specs 基准一致性分析器，执行以下任务：

      1. 读取 changed_files.md、changed_code_context.md、specs_reference.md、specs_alignment.md 和 existing_comments.md
      2. 只分析当前 CR 中发生变更的代码文件，不允许对未变更代码添加评论
      3. 将 loongsuite-pilot/specs 目录下的 specs 视为当前项目基准，判断变更代码是否遵循 specs
      4. 生成 specs_review.md，必须逐项解释：
         - 当前变更关联到哪些 spec 文件/章节
         - 当前变更是否遵循 specs，以及判断依据
         - 如果建议修改 specs，应该修改哪些 spec 文件/章节/字段，以及为什么代码变更意味着基准需要更新
         - 如果不建议修改 specs，为什么不需要修改，例如实现细节未改变契约、已有 spec 覆盖、没有找到相关 spec、或代码应回到 spec 约束
      5. 如果发现当前变更明显违反 specs 且属于高风险问题，先检查 existing_comments.md 是否已有相似评论；没有相似评论时，使用 mcp__aone__comment_merge_request_changed_file 工具在对应变更行添加 CR 评论
      6. 如果只是建议补充或更新 specs，但代码本身不构成高风险，不要添加高风险 CR 评论，只写入 specs_review.md

      统一评论格式要求：
      - 问题标题（带风险等级标识：🔴高风险）
      - 问题描述：说明违反了哪个 spec 约束
      - 代码范围：文件名和具体行号
      - 修改建议：说明应调整代码以符合 specs，或说明必须同步修改 specs 的位置和原因
      - Markdown 格式，良好可读性

      ⚠️ 重要提醒：你在非交互式CI环境中运行，不能建议手动操作！必须自动执行工具调用！

      要求：
      - specs_review.md 必须存在，即使没有发现问题也要写明结论
      - 不要臆造 specs；只能基于 specs_reference.md 和 mcp__aone__search_code 搜索结果
      - 添加评论必须添加到当前分支对应的变更行，不允许错位
      - 添加评论后必须追加到 existing_comments.md，避免后续处理器重复评论
      "
      cat specs_review.md
      
      # =============================================================================
      # 步骤5: 分层并行处理（3个独立的 Claude Code 实例）
      # =============================================================================
      echo "步骤5: 启动分层并行处理..."
      
      # Level 1 处理器 - 深度分析未分析区域
      echo "启动 Level 1 处理器（深度分析）..."
      claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone" --print "
      作为[仓库: ${repo}, 分支: ${sourceBranch}]代码评审的 Level 1 处理器，专注深度分析：
        
      1. 读取 level1_unanalyzed.md 中的未分析区域
      2. 对这些区域进行完整的代码审查（重点：全面分析逻辑、性能问题）
      3. 给出问题点分析，严格遵守以下5个要点
      **统一评论格式要求：**
      - 问题标题（带风险等级标识：🔴高风险 🟡中风险 🟢低风险）
      - 问题描述
      - 代码范围（文件名和具体行号；如果代码不多，请用代码块直接展示出来）
      - 修改建议
      - Markdown 格式，良好可读性
      4. 最重要的任务：仅对高风险的问题点上报CR评论，上报CR时检查existing_comments.md是否存在相似评论，存在就不再添加，**不存在相似评论**使用mcp aone的 comment_merge_request_changed_file 工具来为CR添加评论。
        
      ⚠️ 重要提醒：你在非交互式CI环境中运行，不能建议手动操作！必须自动执行工具调用！
        
      要求：
      - 严格注意底线：只看当前分支里变更的部分！不允许对当前分支未变更的部分添加任何评论
      - 添加的评论必须添加到当前分支对应的行数位置，不允许错位添加！
      - 仅采纳高风险问题
      - 添加的评论必须检查是否已经存在相似评论，如果已经存在相似评论，就不要再添加评论了，只有没有存在相似评论才调用工具添加评论
      - 添加的评论必须追加到 existing_comments.md, 每次添加评论前必须检查是否在 existing_comments.md 存在相似记录，存在就不能重复添加
      - 类属性访问范围、接口访问范围 不添加评论
        " &
      level1_pid=$!
      
      # Level 2 处理器 - 增量分析部分分析区域  
      echo "启动 Level 2 处理器（增量分析）..."
      timeout 1800 claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone" --print "
      作为[仓库: ${repo}, 分支: ${sourceBranch}]代码评审的 Level 2 处理器，专注增量分析：
        
      1. 读取 level2_partial.md 中的部分分析区域
      2. 重点关注新增的代码行（重点：新增逻辑正确性、兼容性、边界情况）
      3. 避免与现有评论重复，只分析新增部分
      4. 给出问题点分析，严格遵守以下5个要点
      **统一评论格式要求：**
      - 问题标题（带风险等级标识：🔴高风险 🟡中风险 🟢低风险）
      - 问题描述
      - 代码范围（文件名和具体行号；如果代码不多，请用代码块直接展示出来）
      - 修改建议
      - Markdown 格式，良好可读性
      5. 最重要的任务：仅对高风险的问题点上报CR评论，上报CR时检查existing_comments.md是否存在相似评论，存在就不再添加，**不存在相似评论**使用mcp aone的 comment_merge_request_changed_file 工具来为CR添加评论。
        
      ⚠️ 重要提醒：你在非交互式CI环境中运行，不能建议手动操作！必须自动执行工具调用！
        
      要求：
      - 严格注意底线：只看当前分支里变更的部分！不允许对当前分支未变更的部分添加任何评论
      - 添加的评论必须添加到当前分支对应的行数位置，不允许错位添加！
      - 仅采纳高风险问题
      - 添加的评论必须检查是否已经存在相似评论，如果已经存在相似评论，就不要再添加评论了，只有没有存在相似评论才调用工具添加评论
      - 添加的评论必须追加到 existing_comments.md, 每次添加评论前必须检查是否在 existing_comments.md 存在相似记录，存在就不能重复添加
      - 类属性访问范围、接口访问范围 不添加评论
      " &
      level2_pid=$!
      
      # Level 3 处理器 - 轻量重审变更影响
      echo "启动 Level 3 处理器（变更影响重审）..."
      timeout 1800 claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone" --print "
      作为[仓库: ${repo}, 分支: ${sourceBranch}]代码评审的 Level 3 处理器，专注变更影响重审：
        
      1. 读取 level3_recheck.md 中需要重审的区域
      2. 分析代码变更对现有逻辑的影响（重点：接口变更、业务逻辑风险）
      3. 检查是否有破坏性变更或逻辑冲突
      4. 给出问题点分析，严格遵守以下5个要点
      **统一评论格式要求：**
      - 问题标题（带风险等级标识：🔴高风险 🟡中风险 🟢低风险）
      - 问题描述
      - 代码范围（文件名和具体行号；如果代码不多，请用代码块直接展示出来）
      - 修改建议
      - Markdown 格式，良好可读性
      5. 最重要的任务：仅对高风险的问题点上报CR评论，上报CR时检查existing_comments.md是否存在相似评论，存在就不再添加，**不存在相似评论**使用mcp aone的 comment_merge_request_changed_file 工具来为CR添加评论。
        
      ⚠️ 重要提醒：你在非交互式CI环境中运行，不能建议手动操作！必须自动执行工具调用！
        
      要求：
      - 严格注意底线：只看当前分支里变更的部分！不允许对当前分支未变更的部分添加任何评论
      - 添加的评论必须添加到当前分支对应的行数位置，不允许错位添加！
      - 仅采纳高风险问题
      - 添加的评论必须检查是否已经存在相似评论，如果已经存在相似评论，就不要再添加评论了，只有没有存在相似评论才调用工具添加评论
      - 添加的评论必须追加到 existing_comments.md, 每次添加评论前必须检查是否在 existing_comments.md 存在相似评论，存在就不能重复添加!
      - 类属性访问范围、接口访问范围 不添加评论
      " &
      level3_pid=$!
      
      # 等待所有并行处理器完成（带超时监控）
      echo "等待所有处理器完成（最多10分钟）..."
      start_time=$(date +%s)
      max_wait=1800  # 10分钟
        
      while true; do
        current_time=$(date +%s)
        elapsed=$((current_time - start_time))
        
        # 检查是否超过最大等待时间
        if [ $elapsed -gt $max_wait ]; then
          echo "处理器运行时间超过 ${max_wait} 秒，强制终止..."
          kill $level1_pid $level2_pid $level3_pid 2>/dev/null
          echo "所有处理器已强制终止"
          break
        fi
        
        # 检查所有进程是否完成
        if ! kill -0 $level1_pid 2>/dev/null && ! kill -0 $level2_pid 2>/dev/null && ! kill -0 $level3_pid 2>/dev/null; then
          echo "所有处理器已完成"
          break
        fi
        
        # 显示进度
        running_count=0
        kill -0 $level1_pid 2>/dev/null && running_count=$((running_count + 1))
        kill -0 $level2_pid 2>/dev/null && running_count=$((running_count + 1))
        kill -0 $level3_pid 2>/dev/null && running_count=$((running_count + 1))
        
        echo "还有 ${running_count} 个处理器在运行中... (已运行 ${elapsed}s)"
        sleep 30  # 每30秒检查一次
      done
        
      echo "智能分层 AI 代码评审完成！"
      
      # =============================================================================
      # 验证步骤：检查是否真的添加了评论
      # =============================================================================
      echo "验证步骤: 检查AI是否真的添加了评论..."
      claude --permission-mode acceptEdits --mcp-config mcp.json --allowedTools "mcp__aone__list_merge_request_comments" --print "
      验证任务：
      1. 使用 mcp__aone__list_merge_request_comments 工具重新获取CR的所有评论
      2. 对比旧的existing_comments.md，检查是否有新的AI评论被添加
      3. 如果没有发现新评论，明确报告'验证失败：AI未添加任何评论'
      4. 如果发现了新评论，报告'验证成功：AI成功添加了X条评论'
      "
      
      # =============================================================================
      # 完成总结
      # =============================================================================
      echo "
      ✅分析完成总结：
      "


jobs:
  claude-code:
    image: alios-8u
    steps:
      - uses: checkout
      - uses: setup-env
        inputs:
          node-version: 20
          tnpm-version: 10
          tnpm-cache: true
      - id: Claude_Code_Run
        run: |-
          tnpm install -g @anthropic-ai/claude-code
          export ANTHROPIC_BASE_URL=${{params.ANTHROPIC_BASE_URL}}
          export ANTHROPIC_AUTH_TOKEN=${{params.ANTHROPIC_AUTH_TOKEN}}
          export ANTHROPIC_MODEL=${{params.ANTHROPIC_MODEL}}
          echo claude-code安装成功

          ${{params.shell}}
          